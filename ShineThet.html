<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for message list */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col justify-center items-center p-2 sm:p-4">

    <!-- App Container -->
    <div id="app" class="w-full max-w-2xl h-[92vh] sm:h-[85vh] bg-white rounded-2xl shadow-xl flex flex-col overflow-hidden border border-slate-200">
        
        <!-- Login Modal / Screen -->
        <div id="login-screen" class="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-br from-indigo-50 via-white to-slate-100">
            <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center border border-slate-100">
                <div class="w-16 h-16 bg-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-white text-2xl shadow-md">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 mb-2">မင်္ဂလာပါ Chat App မှ ကြိုဆိုပါတယ်</h1>
                <p class="text-slate-500 text-sm mb-6">အခြားသူများနှင့် တိုက်ရိုက် စာအပြန်အလှန် ပို့ရန် သင့်အမည် သို့မဟုတ် အမည်ဝှက်ကို ထည့်သွင်းပါ။</p>
                
                <form id="login-form" class="space-y-4">
                    <div>
                        <input type="text" id="nickname-input" required maxlength="25" placeholder="သင့် နာမည် ထည့်ပါ..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-slate-800">
                    </div>
                    <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                        <span>စတင်အသုံးပြုမည်</span>
                        <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Main Chat Screen (Hidden initially) -->
        <div id="chat-screen" class="hidden flex-1 flex flex-col h-full bg-slate-50">
            <!-- Header -->
            <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm z-10">
                <div class="flex items-center space-x-3">
                    <div class="relative">
                        <div id="user-avatar" class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                            U
                        </div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></span>
                    </div>
                    <div>
                        <h2 id="current-username" class="font-bold text-slate-800 leading-tight">Username</h2>
                        <span class="text-xs text-green-600 font-medium flex items-center gap-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span> အွန်လိုင်း ရှိနေသည်
                        </span>
                    </div>
                </div>
                
                <div class="flex items-center space-x-2">
                    <button id="logout-btn" title="ထွက်မည်" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-all">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                    </button>
                </div>
            </header>

            <!-- Chat Messages Area -->
            <div id="messages-container" class="chat-messages flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Messages will be dynamically rendered here -->
                <div id="loading-spinner" class="flex justify-center items-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div>
                </div>
            </div>

            <!-- Message Input Area -->
            <footer class="bg-white border-t border-slate-200 p-3 sm:p-4">
                <form id="message-form" class="flex items-center space-x-2">
                    <input type="text" id="message-input" autocomplete="off" placeholder="စာရိုက်ပါ..." class="flex-1 bg-slate-100 hover:bg-slate-200/60 focus:bg-white text-slate-800 border border-transparent focus:border-indigo-500 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-100 transition-all text-sm sm:text-base">
                    <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl shadow-md hover:shadow-lg transition-all flex items-center justify-center disabled:opacity-50">
                        <i class="fa-solid fa-paper-plane text-lg px-1"></i>
                    </button>
                </form>
            </footer>
        </div>

    </div>

    <!-- Firebase App & Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global/Environment Configurations
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-chat-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Default placeholder config for fallback
            apiKey: "AIzaSyDummyKey",
            authDomain: "dummy.firebaseapp.com",
            projectId: "dummy-project",
            storageBucket: "dummy.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI State
        let currentUser = null;
        let userNickname = localStorage.getItem('chat_nickname') || '';

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const loginForm = document.getElementById('login-form');
        const nicknameInput = document.getElementById('nickname-input');
        const currentUsernameEl = document.getElementById('current-username');
        const userAvatarEl = document.getElementById('user-avatar');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const messagesContainer = document.getElementById('messages-container');
        const logoutBtn = document.getElementById('logout-btn');
        const loadingSpinner = document.getElementById('loading-spinner');

        // Initial Auth Setup
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth initialization failed:", error);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                if (userNickname) {
                    showChatScreen();
                    startListeningMessages();
                }
            }
        });

        // Event Listeners
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = nicknameInput.value.trim();
            if (val) {
                userNickname = val;
                localStorage.setItem('chat_nickname', userNickname);
                showChatScreen();
                if (currentUser) {
                    startListeningMessages();
                }
            }
        });

        logoutBtn.addEventListener('click', () => {
            userNickname = '';
            localStorage.removeItem('chat_nickname');
            chatScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            nicknameInput.value = '';
        });

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text || !currentUser) return;

            messageInput.value = '';

            try {
                // Save message to public collection according to mandatory Rule 1
                const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
                await addDoc(messagesRef, {
                    text: text,
                    senderUid: currentUser.uid,
                    senderName: userNickname,
                    createdAt: serverTimestamp()
                });
            } catch (err) {
                console.error("Error sending message: ", err);
            }
        });

        function showChatScreen() {
            loginScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            currentUsernameEl.textContent = userNickname;
            userAvatarEl.textContent = userNickname.charAt(0).toUpperCase();
        }

        // Real-time Firestore Listener
        let unsubscribe = null;
        function startListeningMessages() {
            if (unsubscribe) unsubscribe();

            const messagesRef = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            
            // Simple query without compound ordering/filtering (RULE 2)
            unsubscribe = onSnapshot(messagesRef, (snapshot) => {
                const messages = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    messages.push({
                        id: doc.id,
                        ...data
                    });
                });

                // In-memory sort by createdAt timestamp (RULE 2)
                messages.sort((a, b) => {
                    const timeA = a.createdAt?.seconds || 0;
                    const timeB = b.createdAt?.seconds || 0;
                    return timeA - timeB;
                });

                renderMessages(messages);
            }, (error) => {
                console.error("Firestore snapshot error: ", error);
            });
        }

        // Helper to format timestamps
        function formatTime(timestamp) {
            if (!timestamp) return 'ခုနက';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp.seconds * 1000);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        // Render Messages in UI
        function renderMessages(messages) {
            if (loadingSpinner) {
                loadingSpinner.style.display = 'none';
            }

            messagesContainer.innerHTML = '';

            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="text-center text-slate-400 py-12">
                        <i class="fa-regular fa-comments text-4xl mb-3 block"></i>
                        <p class="text-sm">စာများ မရှိသေးပါ။ ပထမဆုံး စာစတင် ပို့လိုက်ပါ!</p>
                    </div>
                `;
                return;
            }

            messages.forEach((msg) => {
                const isMe = currentUser && msg.senderUid === currentUser.uid;
                
                const msgWrapper = document.createElement('div');
                msgWrapper.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

                const timeStr = formatTime(msg.createdAt);

                msgWrapper.innerHTML = `
                    <div class="flex items-end gap-2 max-w-[85%] sm:max-w-[75%] ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                        ${!isMe ? `
                            <div class="w-8 h-8 rounded-full bg-slate-300 text-slate-700 font-semibold flex items-center justify-center text-xs flex-shrink-0">
                                ${(msg.senderName || 'U').charAt(0).toUpperCase()}
                            </div>
                        ` : ''}
                        
                        <div>
                            ${!isMe ? `<span class="text-xs font-semibold text-slate-500 mb-1 block px-1">${escapeHTML(msg.senderName || 'User')}</span>` : ''}
                            <div class="px-4 py-2.5 rounded-2xl text-sm leading-relaxed shadow-sm ${
                                isMe 
                                    ? 'bg-indigo-600 text-white rounded-br-none' 
                                    : 'bg-white text-slate-800 border border-slate-200 rounded-bl-none'
                            }">
                                ${escapeHTML(msg.text)}
                            </div>
                            <span class="text-[10px] text-slate-400 mt-1 block px-1 ${isMe ? 'text-right' : 'text-left'}">${timeStr}</span>
                        </div>
                    </div>
                `;

                messagesContainer.appendChild(msgWrapper);
            });

            // Smooth scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Security Helper to avoid XSS
        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Start initialization
        initAuth();
    </script>
</body>
</html>
